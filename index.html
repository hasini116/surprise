<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise 🎂</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    overflow-x: hidden;

    background:
        radial-gradient(circle at top, #ff9ac2, transparent 40%),
        linear-gradient(135deg, #ff4f81, #7b2cbf);
}


/* START SCREEN */

.start-screen {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    flex-direction: column;

    padding: 20px;
}

.gift {
    font-size: 100px;

    animation:
        bounce 1.5s infinite,
        glow 2s infinite;
}

.start-screen h1 {
    font-size: 42px;
}

.start-screen p {
    font-size: 20px;
}


.start-button {

    margin-top: 25px;

    padding: 16px 35px;

    border: none;

    border-radius: 50px;

    background: white;

    color: #ff4f81;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 8px 30px rgba(0,0,0,0.3);

    transition: 0.3s;
}


.start-button:hover {

    transform: scale(1.1);

}


/* BIRTHDAY PAGE */

.birthday-page {

    display: none;

    padding: 30px 15px 80px;

}


.birthday-title {

    font-size: 52px;

    margin-top: 20px;

    animation: titleAnimation 1.5s ease;

    text-shadow:
        0 0 10px white,
        0 0 20px #ffb6d5;
}


.message {

    font-size: 21px;

    max-width: 700px;

    margin: 20px auto 40px;

}


/* PHOTO COLLAGE */

.photo-collage {

    width: 90%;

    max-width: 900px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(6, 1fr);

    grid-auto-rows: 120px;

    gap: 12px;

}


/* PHOTO */

.photo {

    overflow: hidden;

    border-radius: 20px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.5);

    border: 3px solid rgba(255,255,255,0.8);

    opacity: 0;

    animation:
        photoAppear 1s forwards;

    transition: 0.4s;

}


.photo:hover {

    transform:
        scale(1.08)
        rotate(0deg);

    z-index: 10;

}


.photo img {

    width: 100%;

    height: 100%;

    object-fit: cover;

}


/* DIFFERENT PHOTO SIZES */

.photo1 {

    grid-column: span 3;

    grid-row: span 3;

    transform: rotate(-3deg);

    animation-delay: 0.2s;

}


.photo2 {

    grid-column: span 3;

    grid-row: span 2;

    transform: rotate(3deg);

    animation-delay: 0.5s;

}


.photo3 {

    grid-column: span 2;

    grid-row: span 2;

    transform: rotate(-2deg);

    animation-delay: 0.8s;

}


.photo4 {

    grid-column: span 2;

    grid-row: span 2;

    transform: rotate(2deg);

    animation-delay: 1.1s;

}


.photo5 {

    grid-column: span 2;

    grid-row: span 2;

    transform: rotate(-3deg);

    animation-delay: 1.4s;

}


/* VIDEO */

.video-container {

    margin: 50px auto;

    width: 90%;

    max-width: 800px;

}


video {

    width: 100%;

    border-radius: 20px;

    box-shadow:
        0 15px 50px rgba(0,0,0,0.5);

}


/* HEARTS */

.hearts {

    font-size: 40px;

    margin: 30px;

}


/* CONFETTI */

.confetti {

    position: fixed;

    top: -30px;

    font-size: 25px;

    pointer-events: none;

    animation:
        fall 5s linear forwards;

    z-index: 100;
}


/* ANIMATIONS */

@keyframes bounce {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-20px);
    }

}


@keyframes glow {

    0%,100% {
        filter: drop-shadow(0 0 5px white);
    }

    50% {
        filter: drop-shadow(0 0 25px white);
    }

}


@keyframes titleAnimation {

    0% {

        opacity: 0;

        transform:
            scale(0.3)
            rotate(-10deg);

    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0);

    }

}


@keyframes photoAppear {

    0% {

        opacity: 0;

        transform:
            scale(0.2)
            rotate(20deg);

    }

    70% {

        opacity: 1;

        transform:
            scale(1.05)
            rotate(0);

    }

    100% {

        opacity: 1;

    }

}


@keyframes fall {

    0% {

        transform:
            translateY(-30px)
            rotate(0);

    }

    100% {

        transform:
            translateY(110vh)
            rotate(720deg);

    }

}


/* MOBILE */

@media(max-width:600px) {

    .start-screen h1 {

        font-size: 30px;

    }

    .birthday-title {

        font-size: 35px;

    }

    .photo-collage {

        grid-template-columns:
            repeat(2, 1fr);

        grid-auto-rows: 150px;

    }

    .photo1 {

        grid-column: span 2;

        grid-row: span 2;

    }

    .photo2 {

        grid-column: span 2;

    }

    .photo3,
    .photo4,
    .photo5 {

        grid-column: span 1;

    }

}

</style>

</head>


<body>


<!-- START SCREEN -->

<div class="start-screen" id="startScreen">

    <div class="gift">🎁</div>

    <h1>
        A Special Surprise For You ❤️
    </h1>

    <p>
        Someone prepared something special for you...
    </p>

    <button
        class="start-button"
        onclick="openSurprise()">

        🎁 OPEN SURPRISE

    </button>

</div>



<!-- BIRTHDAY PAGE -->

<div
    class="birthday-page"
    id="birthdayPage">


    <div class="hearts">
        🎈 🎉 🎂 🎉 🎈
    </div>


    <h1 class="birthday-title">

        HAPPY BIRTHDAY! 🎉

    </h1>


    <p class="message">

        Wishing you a beautiful birthday
        filled with happiness, love and
        unforgettable memories! ❤️

    </p>



    <!-- PHOTO COLLAGE -->

    <div class="photo-collage">


        <div class="photo photo1">

            <img
                src="20240601_170328.jpg">

        </div>


        <div class="photo photo2">

            <img
                src="20240606_125333.jpg">

        </div>


        <div class="photo photo3">

            <img
                src="20240629_223614.jpg">

        </div>


        <div class="photo photo4">

            <img
                src="20240704_203538.jpg">

        </div>


        <div class="photo photo5">

            <img
                src="20240816_134553.jpg">

        </div>


    </div>



    <!-- VIDEO -->

    <div class="video-container">

        <video
            id="birthdayVideo"
            controls>

            <source
                src="birthday.mp4"
                type="video/mp4">

        </video>

    </div>


    <div class="hearts">

        ❤️ 💖 ❤️ 💖 ❤️

    </div>


</div>



<!-- MUSIC -->

<audio
    id="birthdaySong"
    loop>

    <source
        src="birthday.mp3"
        type="audio/mpeg">

</audio>



<script>


function openSurprise() {


    /* Hide start screen */

    document
        .getElementById("startScreen")
        .style.display = "none";


    /* Show birthday page */

    document
        .getElementById("birthdayPage")
        .style.display = "block";


    /* Start music */

    const song =
        document.getElementById("birthdaySong");


    song.play().catch(function(error) {

        console.log(error);

    });


    /* Start video */

    const video =
        document.getElementById("birthdayVideo");


    video.play().catch(function(error) {

        console.log(error);

    });


    /* Create confetti */

    createConfetti();

}



function createConfetti() {


    const emojis = [

        "🎉",
        "🎈",
        "❤️",
        "✨",
        "🎊",
        "💖"

    ];


    for (
        let i = 0;
        i < 60;
        i++
    ) {


        const confetti =
            document.createElement("div");


        confetti
            .classList
            .add("confetti");


        confetti.innerHTML =
            emojis[
                Math.floor(
                    Math.random()
                    * emojis.length
                )
            ];


        confetti.style.left =
            Math.random() * 100 + "vw";


        confetti.style.animationDelay =
            Math.random() * 3 + "s";


        document.body
            .appendChild(confetti);

    }

}

</script>


</body>

</html>
